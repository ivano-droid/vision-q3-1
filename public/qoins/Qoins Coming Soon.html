<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Qoins — Coming soon</title>
<link rel="stylesheet" href="styles.css" />
<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#0a2ecb"/>
    <circle cx="38" cy="56" r="15" fill="#ffdf00" stroke="#0c2287" stroke-width="3"/>
    <circle cx="62" cy="46" r="17" fill="#ffdf00" stroke="#0c2287" stroke-width="3"/>
    <path d="M54 50h16M56 50l-2.5-9 5 4.5 3-7 3 7 5-4.5-2.5 9z" fill="none" stroke="#0c2287" stroke-width="2.2" stroke-linejoin="round"/>
  </svg>
</template>
<style>
  /* ---- coming-soon page specifics (chrome + tokens come from styles.css) ---- */
  /* tight blue — just the top bar */
  .header{ padding:0 0 10px; }

  .cs-hero{
    display:flex; align-items:center; justify-content:center;
    padding:0 24px 8px;
  }
  .cs-bundle{
    width:262px; max-width:78%; height:auto; display:block;
  }

  .cs-body{ padding:6px 24px; text-align:center; }

  /* vertically center hero + copy between the top bar and bottom */
  .cs-main{
    flex:1; display:flex; flex-direction:column; justify-content:center;
    padding-bottom:40px;
  }
  .scroll{ display:flex; flex-direction:column; }
  .cs-title{
    font-weight:800; font-size:34px; line-height:1.04; letter-spacing:-1px;
    color:var(--brand900); margin:0 0 14px; text-wrap:balance;
  }
  .cs-copy{
    font-weight:500; font-size:16px; line-height:1.5; color:var(--muted);
    margin:0 auto; max-width:280px; text-wrap:pretty;
  }
  .cs-cta{
    display:inline-flex; align-items:center; justify-content:center;
    height:50px; padding:0 26px; margin-top:28px;
    border:0; border-radius:12px; cursor:pointer;
    background:var(--brand500); color:#fff;
    font-family:var(--font); font-weight:800; font-size:16px; letter-spacing:-.2px;
    text-decoration:none; transition:background .2s ease;
  }
  .cs-cta:hover{ background:var(--brand900); }

  /* staged intro: blue grows from the top-bar strip, then content fades up */
  .screen.intro .header{ animation:introHeader .58s cubic-bezier(.4,0,.2,1) both; }
  .screen.intro .cs-hero{ animation:introUp .5s ease .46s both; }
  .screen.intro .cs-body{ animation:introUp .5s ease .72s both; }
  @media (prefers-reduced-motion:no-preference){
    @keyframes introHeader{
      0%{ clip-path:inset(0 0 calc(100% - 100px) 0 round 0 0 24px 24px); }
      100%{ clip-path:inset(0 0 0 0 round 0 0 24px 24px); }
    }
    @keyframes introUp{ 0%{ opacity:0; transform:translateY(12px); } 100%{ opacity:1; transform:none; } }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="screen intro">
    <div class="scroll">

      <!-- ---------------- HEADER (same as Qoins page) ---------------- -->
      <div class="header">
        <div class="statusbar">
          <span class="time">9:41</span>
          <span class="sysicons">
            <svg width="18" height="12" viewBox="0 0 18 12" fill="#fff">
              <rect x="0" y="8" width="3" height="4" rx="1"></rect>
              <rect x="5" y="5.5" width="3" height="6.5" rx="1"></rect>
              <rect x="10" y="3" width="3" height="9" rx="1"></rect>
              <rect x="15" y="0" width="3" height="12" rx="1"></rect>
            </svg>
            <svg width="17" height="12" viewBox="0 0 17 12" fill="#fff">
              <path d="M8.5 2.2c2.6 0 5 1 6.8 2.6l1.5-1.6A12 12 0 0 0 8.5 0 12 12 0 0 0 .2 3.2l1.5 1.6A9.6 9.6 0 0 1 8.5 2.2z"></path>
              <path d="M8.5 6c1.4 0 2.7.5 3.7 1.4l1.5-1.6A9 9 0 0 0 8.5 3.5 9 9 0 0 0 2.8 5.8l1.5 1.6A6.2 6.2 0 0 1 8.5 6z"></path>
              <path d="M8.5 9.2 11 6.9a4 4 0 0 0-5 0z"></path>
            </svg>
            <svg width="26" height="13" viewBox="0 0 26 13" fill="none">
              <rect x="0.5" y="0.5" width="22" height="12" rx="3.5" stroke="#fff" opacity="0.5"></rect>
              <rect x="2" y="2" width="19" height="9" rx="2" fill="#fff"></rect>
              <rect x="24" y="4" width="1.6" height="5" rx="0.8" fill="#fff" opacity="0.6"></rect>
            </svg>
          </span>
        </div>
        <div class="nav">
          <a class="iconbtn" href="Qoins Rewards.html" aria-label="Back">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
          </a>
          <div class="nav-right">
            <div class="qoins-pill">
              <span class="coin"></span>
              <span class="amt">0</span>
            </div>
            <div class="balance-pill">
              <span class="bal">£113.59</span>
              <span class="divider"></span>
              <span class="avatar"><img src="assets/avatar-nav.png" alt="" /></span>
            </div>
          </div>
        </div>
      </div>

      <!-- ---------------- BODY (grey/white) ---------------- -->
      <div class="cs-main">
        <div class="cs-hero">
          <img class="cs-bundle" src="assets/qoins-bundle.png" alt="A bundle of Qoins" />
        </div>
        <div class="cs-body">
          <h1 class="cs-title">Qoins are nearly here</h1>
          <p class="cs-copy">
            Soon you'll earn Qoins just by playing, then spend them on free spins and games. No wagering, no catch.
          </p>
          <a class="cs-cta" href="Qoins Rewards.html">Back to home</a>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
  // clear the staged-intro class after it runs so it doesn't replay on interaction
  window.addEventListener('load', function () {
    setTimeout(function () {
      var s = document.querySelector('.screen');
      if (s) s.classList.remove('intro');
    }, 1500);
  });
</script>
</body>
</html>
